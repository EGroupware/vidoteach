<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIDOTEACH – Interaktives Video Tool</title>
<meta name="description" content="VIDOTEACH – das interaktive Video-Tool für Schule und Hochschule. Wählen Sie Ihre Sprache. / The interactive video tool for schools and universities. Choose your language.">
<link rel="canonical" href="https://www.vidoteach.de/">
<link rel="alternate" hreflang="de" href="https://www.vidoteach.de/de/">
<link rel="alternate" hreflang="en" href="https://www.vidoteach.de/en/">
<link rel="alternate" hreflang="x-default" href="https://www.vidoteach.de/en/">
<link rel="icon" href="/assets/uploads/fbrfg/favicon-32x32.png" type="image/png">
<script>
  /* Language switch as on www.egroupware.org: a choice made with the flags
     ("vidoteach-lang") wins, otherwise the browser language decides:
     German to /de/, everything else to /en/. Without JavaScript the
     choice below stays visible. */
  (function () {
    var target = "/en/";
    try {
      var saved = localStorage.getItem("vidoteach-lang");
      if (saved === "de" || saved === "en") {
        target = "/" + saved + "/";
      } else {
        var langs = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < langs.length; i++) {
          var l = String(langs[i]).toLowerCase();
          if (l === "de" || l.indexOf("de-") === 0) { target = "/de/"; break; }
          if (l === "en" || l.indexOf("en-") === 0) { break; }
        }
      }
    } catch (e) { /* no localStorage: browser language only */ }
    location.replace(target);
  })();
</script>
<style>
  body { margin: 0; font-family: "Open Sans", Arial, sans-serif; background: #fff; color: #333; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 16px; box-sizing: border-box; text-align: center; }
  img { max-width: min(100%, 300px); height: auto; }
  p { margin: 1.5rem 0; }
  a { display: inline-block; margin: .25rem; padding: .7rem 1.6rem; border-radius: 4px; background: #2ea3f2; color: #fff; text-decoration: none; font-weight: 600; }
  a + a { background: #fff; color: #2ea3f2; box-shadow: inset 0 0 0 2px #2ea3f2; }
</style>
</head>
<body>
<main>
  <img src="/assets/uploads/2023/10/VIDOTEACH_Logo_lang1.webp" width="459" height="72" alt="VIDOTEACH">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">VIDOTEACH</h1>
  <p>Bitte wählen Sie Ihre Sprache. / Please choose your language.</p>
  <div>
    <a href="/de/" hreflang="de">Deutsch</a>
    <a href="/en/" hreflang="en">English</a>
  </div>
</main>
</body>
</html>
